services:

  agent:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./google:/app/google
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # EvolutionAPI v2 (WhatsApp gateway)
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # Si el agent corre en Docker (recomendado), usar el nombre del servicio:
      #   http://agent:8000/webhook
      # Si el agent corre local con uvicorn --reload (dev), cambiar a:
      #   http://host.docker.internal:8000/webhook
      - WEBHOOK_GLOBAL_URL=http://agent:8000/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evo_pass_2024@evolution-postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false
    depends_on:
      - evolution-postgres
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evo_pass_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  evolution_instances:
  postgres_data:
