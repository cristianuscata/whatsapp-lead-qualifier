<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach de alto rendimiento — MVP</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>Coach de alto rendimiento · accountability de metas</h1>
    <p class="aviso">
      Pregunta por tus metas (PTE, Azure, Maestría, MVP, Visa, Sydney) o tus
      recordatorios. Respuestas basadas en herramientas verificables.
      <strong>Datos de demostración.</strong>
    </p>
    <div id="historial"></div>
    <form id="formulario">
      <input id="pregunta" type="text" placeholder="Ej: ¿cómo voy con PTE? / ¿qué tengo pendiente?" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
